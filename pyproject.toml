[project]
name = "cosyvoice"
version = "3.0.0"
description = "Multi-lingual large voice generation model"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "conformer==0.3.2",
    "diffusers==0.29.0",
    "gdown==5.1.0",
    "hydra-core==1.3.2",
    "HyperPyYAML==1.2.3",
    "inflect==7.3.1",
    "librosa==0.10.2",
    "lightning==2.2.4",
    "matplotlib==3.7.5",
    "huggingface_hub>=0.20.0",
    "networkx==3.1",
    "numpy==1.26.4",
    "omegaconf==2.3.0",
    "openai-whisper>=20231117",
    "protobuf==4.25",
    "pyarrow==18.1.0",
    "pydantic==2.7.0",
    "rich==13.7.1",
    "soundfile==0.12.1",
    "torch==2.3.1",
    "torchaudio==2.3.1",
    "transformers==4.51.3",
    "x-transformers==2.11.24",
    "wetext==0.0.4",
    "pyworld==0.3.4",
    "wget==3.2",
    "matcha-tts @ git+https://github.com/shivammehta25/Matcha-TTS.git",
]

[project.optional-dependencies]
serve = [
    "fastapi==0.115.6",
    "fastapi-cli==0.0.4",
    "gradio==5.4.0",
    "grpcio==1.57.0",
    "grpcio-tools==1.57.0",
    "uvicorn==0.30.0",
]
train = [
    "deepspeed==0.15.1; sys_platform == 'linux'",
    "tensorboard==2.14.0",
]
onnx = [
    "onnx==1.16.0",
    "onnxruntime-gpu==1.18.0; sys_platform == 'linux'",
    "onnxruntime==1.18.0; sys_platform == 'darwin' or sys_platform == 'win32'",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cosyvoice*"]
